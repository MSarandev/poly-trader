[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polytrader"
version = "0.1.0"
description = "Standalone async client for Polymarket connectivity: market data, order placement, balance, treasury, and health via a Node CLOB bridge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "polytrader" }]
keywords = ["polymarket", "clob", "trading", "prediction-markets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
]

# Core only. web3/eth-account are NOT needed here (withdraw signing lives in the
# Node bridge; the [withdraw] extra is lazy-imported).
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
# Optional local on-chain tooling (lazy-imported). The bridge does the real
# USDC transfer; these are for advanced local verification.
withdraw = [
    "web3>=6.0",
    "eth-account>=0.9",
]
# HTTP/2 keep-alive (optional; falls back to HTTP/1.1).
http2 = [
    "h2>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-httpserver>=1.0",
]

[project.urls]
Homepage = "https://github.com/MSarandev/poly-trader"
Repository = "https://github.com/MSarandev/poly-trader"

[tool.hatch.build.targets.wheel]
packages = ["polytrader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises the client over a real loopback HTTP server",
]

[tool.coverage.run]
source = ["polytrader"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
